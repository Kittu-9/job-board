name: Update jobs

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC), at 17 minutes past
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths-ignore: ["site/jobs.json", "site/status.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest tests/test_scraper.py -v
      - name: Fetch jobs
        run: python -m scraper.scrape
      - name: Save refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/jobs.json site/status.json
          git diff --cached --quiet || (git commit -m "Update jobs" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
